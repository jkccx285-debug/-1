<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقشه‌کش مدرسه — CAD دوبعدی</title>
<style>
:root{--bg:#06050a;--pn:#110d1c;--g:#d4af37;--pu:#8b3fd9;--pl:#c77dff;--t:#ece8f5;--bd:#2b2142}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13px Vazirmatn,Tahoma,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;height:100%;grid-template:"h h h" auto "t c l" 1fr "f f f" auto/62px 1fr 200px}
header{grid-area:h;display:flex;gap:4px;align-items:center;padding:6px 8px;background:var(--pn);border-bottom:2px solid var(--g);flex-wrap:wrap}
.logo{color:var(--g);font-size:16px;margin-left:10px}
button{font:inherit;background:#1a1330;color:var(--g);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;cursor:pointer}
button:hover{border-color:var(--g)}button:focus-visible,input:focus-visible{outline:2px solid var(--pl)}
button.on{background:var(--pu);color:#fff;border-color:var(--g)}
#tb{grid-area:t;background:var(--pn);border-left:1px solid var(--bd);overflow:auto;display:flex;flex-direction:column;gap:3px;padding:4px}
#tb button{display:flex;flex-direction:column;align-items:center;padding:4px 0;font-size:10px;line-height:1.2}
#tb button i{font-style:normal;font-size:18px}
main{grid-area:c;position:relative;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
aside{grid-area:l;background:var(--pn);border-right:1px solid var(--bd);padding:6px;overflow:auto}
aside h4{margin:4px 0;color:var(--g)}
.ly{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid transparent;border-radius:6px}
.ly.cur{border-color:var(--g);background:#1d1533}.ly span{flex:1;cursor:pointer}
.ly input[type=color]{width:24px;height:20px;padding:0;border:0;background:none}
#info{margin-top:8px;color:#b9aedd;line-height:1.7;direction:rtl}
footer{grid-area:f;background:var(--pn);border-top:1px solid var(--bd)}
#log{padding:3px 8px;color:var(--pl);min-height:20px}
#cl{display:flex;align-items:center;gap:6px;padding:0 8px 4px}
#cmd{flex:1;background:#000;color:var(--g);border:1px solid var(--g);border-radius:6px;padding:6px;font:14px Consolas,monospace;direction:ltr;text-align:left}
#st{display:flex;gap:4px;padding:4px 8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--bd)}
#xy{direction:ltr;color:var(--g);font-family:Consolas,monospace;min-width:150px}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
.modal[hidden]{display:none}
.box{background:var(--pn);border:2px solid var(--g);border-radius:10px;max-width:640px;width:92%;max-height:86%;overflow:auto;padding:16px;line-height:1.9}
.box h3{color:var(--g);margin:0 0 6px}.box h5{color:var(--pl);margin:10px 0 2px;font-size:14px}
kbd{background:#000;color:var(--g);border:1px solid var(--bd);border-radius:4px;padding:0 5px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
#tabs{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:4px}
#tabs button{background:#0d0916e6}#tabs button.on{background:var(--pu);color:#fff;border-color:var(--g)}
#nlp{position:absolute;top:44px;right:8px;z-index:3;width:350px;max-width:calc(100% - 16px);max-height:calc(100% - 56px);overflow:auto;background:#110d1cf5;border:1px solid var(--g);border-radius:10px;padding:10px;line-height:1.7}
#nlp[hidden]{display:none}#nlp b{color:var(--g)}
#nlt{width:100%;background:#000;color:var(--t);border:1px solid var(--g);border-radius:6px;padding:6px;font:13px Tahoma,sans-serif;resize:vertical;margin:6px 0}
#nlo div{font-size:12px}#nlo .ok{color:#8ee6a0}#nlo .er{color:#ff9a9a}
#nlx{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}#nlx button{font-size:11px}
#nlp small{color:#b9aedd;display:block;margin-top:6px}
@media(max-width:640px){#app{grid-template:"h h" auto "c c" 1fr "t l" auto "f f" auto/1fr 1fr}#tb{flex-direction:row;border:0}#tb button{min-width:50px}aside{max-height:110px}}
</style></head><body>
<div id="app">
<header><b class="logo">◈ نقشه‌کش مدرسه</b>
<button data-a="new">جدید</button><button data-a="open">باز کردن</button><button data-a="save">ذخیره</button>
<button data-a="png">PNG</button><button data-a="svg">SVG</button><button data-a="dxf">DXF</button><button data-a="print">چاپ</button>
<button data-a="undo">↶ واگرد</button><button data-a="redo">↷ ازنو</button><button data-a="fit">⤢ نمایش همه</button><button data-a="help">؟ راهنما</button></header>
<nav id="tb"></nav>
<main><canvas id="cv"></canvas>
<div id="tabs"><button id="tm" class="on">✎ رسم دستی</button><button id="tn">✦ رسم با دستور</button></div>
<div id="nlp" hidden><b>با جملهٔ فارسی نقشه بکشید</b>
<textarea id="nlt" rows="7" placeholder="مثلاً:&#10;مستطیل 200 در 100 از نقطه 0,0&#10;دایره‌ای به شعاع 30 در مرکز 100,50"></textarea>
<button id="nlr" class="on">▶ اجرا (Ctrl+Enter)</button> <button id="nlc">پاک‌کردن متن</button>
<div id="nlo"></div><small>نمونه‌ها (کلیک کنید):</small><div id="nlx"></div>
<small>هر دستور در یک خط یا جدا با «،» یا «سپس». مختصات را بدون فاصله بنویسید: 100,50 — ارقام فارسی هم قبول است. نقطهٔ جاری بین اجراها حفظ می‌شود.</small></div></main>
<aside><h4>لایه‌ها</h4><div id="ly"></div>
<button data-a="addL">+ لایه</button> <button data-a="mvL" title="اشیاء انتخاب‌شده به لایهٔ جاری بروند">انتقال به لایهٔ جاری</button>
<div id="info"></div></aside>
<footer><div id="log"></div>
<div id="cl"><span style="color:var(--g)">فرمان:</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="L ، C ، REC ، 100,50 ، @30&lt;45 ، 25"></div>
<div id="st"><span id="xy">0,0</span>
<button data-a="tg_s">شبکه‌گیر F9</button><button data-a="tg_g">شبکه F7</button><button data-a="tg_r">افقی/عمودی F8</button><button data-a="tg_o">گیر اشیاء F3</button><span id="zm" style="margin-right:auto;direction:ltr"></span></div></footer>
</div>
<div id="hp" class="modal" hidden><div class="box" id="hb"></div></div>
<input type="file" id="fi" accept=".json,.cad.json" hidden>
<script>

 const[a,b]=p,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1e-9,ux=dx/L,uy=dy/L,nx=-uy,ny=ux,o=s.o,h=s.h,A=[a[0]+nx*o,a[1]+ny*o],B=[b[0]+nx*o,b[1]+ny*o],e=(o<0?-1:1)*h*.4,ar=h*.8,q=[];

 for(const q of prims(s)){if(q.k=='L'){const P=q.cl?[...q.p,q.p[0]]:q.p;P.forEach((a,i)=>{r.push({x:a[0],y:a[1],n:'انتها'});if(i)r.push({x:(a[0]+P[i-1][0])/2,y:(a[1]+P[i-1][1])/2,n:'وسط'})})}
 else if(q.k=='C'){r.push({x:q.p[0],y:q.p[1],n:'مرکز'});[[1,0],[0,1],[-1,0],[0,-1]].forEach(d=>r.push({x:q.p[0]+d[0]*q.r,y:q.p[1]+d[1]*q.r,n:'ربع'}))}
 else r.push({x:q.p[0],y:q.p[1],n:'درج'})}return r}
function dist(s,x,y){let r=1e9;for(const q of prims(s)){
 if(q.k=='L'){const P=q.cl?[...q.p,q.p[0]]:q.p;for(let i=1;i<P.length;i++)r=Math.min(r,sd(P[i-1],P[i],x,y))}
 else if(q.k=='C')r=Math.min(r,Math.abs(Math.hypot(x-q.p[0],y-q.p[1])-q.r));
 else{const w=q.s.length*q.h*.6,x0=q.p[0]-(q.al=='center'?w/2:0);r=Math.min(r,Math.hypot(Math.max(x0-x,0,x-x0-w),Math.max(q.p[1]-q.h*.2-y,0,y-q.p[1]-q.h)))}}return r}
function segBox(a,b,x0,y0,x1,y1){let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];
 for(const[p,q]of[[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){if(p==0){if(q<0)return 0}else{const r=q/p;if(p<0){if(r>t1)return 0;if(r>t0)t0=r}else{if(r<t0)return 0;if(r<t1)t1=r}}}return 1}

/* ---------- وضعیت و تاریخچه ---------- */

 tg_s(){op.s^=1;ui()},tg_g(){op.g^=1;ui()},tg_r(){op.r^=1;ui()},tg_o(){op.o^=1;ui()}};

function help(){$('#hb').innerHTML=`<h3>◈ راهنمای نقشه‌کش مدرسه</h3>
<p>برنامهٔ دوبعدی ساده شبیه اتوکد. با ماوس/لمس یا تایپ فرمان رسم کنید. نقشه خودکار در همین مرورگر ذخیره می‌شود.</p>
<h5>حرکت در نما</h5><p>ماوس: چرخ = زوم، دکمهٔ وسط یا <kbd>Space</kbd> = پن. لمس: یک انگشت بکشید = پن، دو انگشت = زوم و پن، ضربهٔ کوتاه = کلیک (در حالت انتخاب، ضربه روی چند شیء آن‌ها را اضافه/کم می‌کند).</p>
<h5>فرمان‌ها (تایپ و Enter)</h5>
<p><kbd>L</kbd> خط، <kbd>PL</kbd> چندخطی، <kbd>REC</kbd> مستطیل، <kbd>C</kbd> دایره، <kbd>T</kbd> متن، <kbd>DIM</kbd> اندازه، <kbd>M</kbd> جابجایی، <kbd>CO</kbd> کپی، <kbd>RO</kbd> دوران، <kbd>MI</kbd> قرینه، <kbd>SC</kbd> مقیاس، <kbd>OF</kbd> موازی، <kbd>E</kbd> حذف، <kbd>U</kbd> واگرد، <kbd>ZE</kbd> نمایش همه، <kbd>ALL</kbd> انتخاب همه</p>
<h5>مختصات دقیق</h5>
<p><kbd>100,50</kbd> مطلق | <kbd>@30,20</kbd> نسبی | <kbd>@50&lt;45</kbd> طول و زاویه (نسبت به نقطهٔ قبل) | <kbd>25</kbd> طول ۲۵ در جهت ماوس (دایره = شعاع، دوران = زاویه)</p>
<h5>ویرایش</h5><p>ابتدا انتخاب کنید (کادر چپ‌به‌راست = کاملاً داخل، راست‌به‌چپ = هر برخورد). سپس: <b>قرینه</b> دو نقطهٔ محور می‌گیرد و نسخهٔ قرینه می‌سازد؛ <b>مقیاس</b> نقطهٔ مبنا و ضریب؛ <b>موازی</b> ابتدا شیء، فاصله، سپس سمت. <kbd>Delete</kbd> حذف، <kbd>Ctrl+Z</kbd> واگرد.</p>
<h5>گیرها</h5><p>گیر اشیاء <kbd>F3</kbd>، شبکه‌گیر <kbd>F9</kbd>، افقی/عمودی <kbd>F8</kbd>، شبکه <kbd>F7</kbd>.</p>
<h5>لایه‌ها و خروجی</h5><p>کلیک روی نام لایه = جاری، دوبار کلیک = تغییر نام. خروجی: ذخیره، PNG، SVG، DXF (متن فارسی به‌صورت کد یونیکد) و چاپ سیاه‌وسفید.</p>
<button onclick="$('#hp').hidden=true" class="on">متوجه شدم</button>`;$('#hp').hidden=false}
$('#hp').onclick=e=>{if(e.target.id=='hp')e.target.hidden=true};
/* ---------- تب رسم با دستور طبیعی ---------- */
const NLX=[['خانهٔ ساده','از 0,0 شروع کن\n100 به راست خط بکش\n60 بالا خط بکش\n100 به چپ خط بکش\n60 پایین خط بکش\nمتن «اتاق» در 40,25\nاندازه از 0,0 تا 100,0'],
['مستطیل و دایره','مستطیل 200 در 100 از نقطه 0,0\nدایره‌ای به شعاع 30 در مرکز 100,50'],
['خط با زاویه','خط به طول 80 با زاویه 30 از 0,0\nخط از 0,0 به 100,50'],
['شش‌ضلعی','شش‌ضلعی منتظم با شعاع 40 در مرکز 0,0\nلایه دیوار را فعال کن، مربع به ضلع 50 از نقطه 100,0']];
const NLN='(-?\\d+(?:\\.\\d+)?)',DIR={'راست':[1,0],'چپ':[-1,0],'بالا':[0,1],'پایین':[0,-1]},SIDES={'مثلث':3,'سه':3,'چهار':4,'پنج':5,'شش':6,'هفت':7,'هشت':8,'ده':10};
function nl(src){
 const fa=fn,R=v=>+v.toFixed(6),out=[];
 let cur=nlCur.slice(),chg=0,made=0,fitA=0;snap_();
 const put=sh=>{sh.l=S.cur;S.shapes.push(sh);chg=1;made++};
 const one=s=>{
  const cs=[...s.matchAll(new RegExp(NLN+'(?:\\s*,\\s*|،)'+NLN,'g'))].map(r=>[+r[1],+r[2]]),
  g=w=>{const r=s.match(new RegExp(w+'\\s*(?:برابر|:|=)?\\s*'+NLN));return r?+r[1]:null},hh=+(14/V.z).toPrecision(1);
  if(/پاک|حذف/.test(s)&&/همه|صفحه|نقشه|کل/.test(s)){S.shapes=[];sel.clear();chg=1;return'همه‌چیز پاک شد'}
  if(/نمایش همه|زوم|کل نقشه/.test(s)){fitA=1;return'نما تنظیم شد'}
  const lm=s.match(/لایه[\u0654\u200c]?ی?\s*(?:جدید\s+)?«?([^\s»،.]+)/);
  if(lm){let i=S.layers.findIndex(L=>L.n.includes(lm[1])||lm[1].includes(L.n));
   if(i<0){if(!/بساز|جدید|ایجاد/.test(s))throw'لایه‌ای با این نام نیست (برای ساخت بنویسید: لایهٔ جدید '+lm[1]+' بساز)';S.layers.push({n:lm[1],c:'#9d4edd',v:1});i=S.layers.length-1}
   S.cur=i;S.layers[i].v=1;chg=1;if(!/خط|دایره|مستطیل|مربع|متن|ضلعی|اندازه|مثلث/.test(s))return'لایهٔ جاری: '+S.layers[i].n}
  const pm=s.match(/(سه|چهار|پنج|شش|هفت|هشت|ده|\d+)[\s\u200c]*ضلعی/)||(/مثلث/.test(s)?[0,'مثلث']:null);
  if(pm){const n=SIDES[pm[1]]||+pm[1];if(!(n>=3&&n<=200))throw'تعداد ضلع‌ها باید بین ۳ و ۲۰۰ باشد';let r=g('شعاع');const a=g('ضلع');if(r==null&&a!=null)r=a/(2*Math.sin(Math.PI/n));if(!(r>0))throw'شعاع یا طول ضلع (عدد مثبت) را بگویید';
   const c=cs[0]||cur;put({t:'pl',cl:1,p:Array.from({length:n},(_,i)=>[R(c[0]+r*Math.cos(Math.PI/2+i*2*Math.PI/n)),R(c[1]+r*Math.sin(Math.PI/2+i*2*Math.PI/n))])});return n+'‌ضلعی منتظم کشیده شد'}
  if(/دایره|گرد/.test(s)){let r=g('شعاع');const d=g('قطر');if(r==null&&d!=null)r=d/2;if(!(r>0))throw'شعاع یا قطر را بگویید، مثلاً: دایره به شعاع 20';put({t:'c',p:[cs[0]||cur],r});return'دایره کشیده شد'}
  if(/مستطیل|مربع|قاب/.test(s)){let w,h;const wh=s.match(new RegExp(NLN+'\\s*(?:در|×|x|\\*)\\s*'+NLN+'(?![\\d.,،])'));
   if(wh){w=+wh[1];h=+wh[2]}else{const a=g('ضلع'),L=g('عرض')??g('طول'),T=g('ارتفاع');if(/مربع/.test(s)&&a!=null)w=h=a;else if(L!=null&&T!=null){w=L;h=T}}
   if(w>0&&h>0){const p=cs[0]||cur;put(mk('rect',[p,[p[0]+w,p[1]+h]]));return'مستطیل '+fmt(w)+'×'+fmt(h)+' کشیده شد'}
   if(cs.length>1){const sh=mk('rect',[cs[0],cs[1]]);if(!sh)throw'مستطیل بی‌اندازه است';put(sh);return'مستطیل کشیده شد'}throw'اندازه را بگویید، مثلاً: مستطیل 200 در 100'}
  if(/متن|بنویس/.test(s)){const q=s.match(/[«"“](.+?)[»"”]/)||s.match(/(?:متن|بنویس)\s+(.+?)(?:\s+(?:در|روی|کنار)\s|$)/);if(!q)throw'متن را داخل «» بنویسید';put({t:'t',p:[cs[0]||cur],s:q[1],h:g('ارتفاع')??+(hh*1.2).toPrecision(1)});return'متن نوشته شد'}
  if(/اندازه/.test(s)&&!/خط|راست|چپ|بالا|پایین/.test(s)){if(cs.length<2||D(cs[0],cs[1])<1e-9)throw'دو نقطهٔ متفاوت بدهید: اندازه از 0,0 تا 100,0';put({t:'d',p:[cs[0],cs[1]],o:hh*3,h:hh});return'اندازه‌گذاری شد'}
  const tm=[...s.matchAll(new RegExp(NLN+'\\s*(?:واحد|سانتی‌?متر|میلی‌?متر|متر|cm|mm)?\\s*(?:به\\s*(?:سمت\\s*)?)?(راست|چپ|بالا|پایین)','g'))];
  if(tm.length){let p=cs[0]||cur;const dr_=!/برو/.test(s)||/خط|بکش|رسم/.test(s);for(const t of tm){const d=DIR[t[2]],q=[R(p[0]+d[0]*t[1]),R(p[1]+d[1]*t[1])];if(dr_&&D(p,q)>1e-9)put({t:'pl',p:[p,q]});p=q}cur=p;return dr_?'خط کشیده شد':'نقطهٔ فعلی جابه‌جا شد'}
  if(/خط|وصل|پاره/.test(s)){const a=cs[0]||cur;let b=cs[1];if(!b){const L=g('طول')??g('اندازه'),an=g('زاویه')??(/عمودی/.test(s)?90:0);if(L==null)throw'دو نقطه یا طول بدهید: خط از 0,0 به 100,50';b=[R(a[0]+L*Math.cos(an*dg)),R(a[1]+L*Math.sin(an*dg))]}if(D(a,b)<1e-9)throw'خط بی‌طول است';put({t:'pl',p:[a,b]});cur=b;return'خط کشیده شد'}
  if(/شروع|برو به|برو روی/.test(s)&&cs.length){cur=cs[0];return'نقطهٔ شروع: '+cs[0].join(' , ')}
  throw'متوجه نشدم'};
 for(const s of fa(src).split(/\n|؛|;|،\s+|\.\s+|\.$|\s+(?:سپس|بعد)\s+/).map(x=>x.trim()).filter(Boolean)){
  try{out.push(['ok','✓ '+one(s)+'  ← '+s])}catch(e){out.push(['er','✗ '+(typeof e=='string'?e:'خطا در اجرا')+'  ← '+s])}}
 nlCur=cur;if(chg)persist();else hist.pop();
 if(made||fitA)fit();ui();return out}
function nlRun(){const t=$('#nlt').value.trim();if(!t){$('#nlo').innerHTML='<div class="er">یک دستور بنویسید</div>';return}
 const o=nl(t);$('#nlo').innerHTML=o.map(r=>`<div class="${r[0]}"></div>`).join('');[...$('#nlo').children].forEach((d,i)=>d.textContent=o[i][1])}
function setTab(n){$('#nlp').hidden=!n;$('#tn').classList.toggle('on',n);$('#tm').classList.toggle('on',!n);if(n)$('#nlt').focus()}
$('#tm').onclick=()=>setTab(0);$('#tn').onclick=()=>setTab(1);$('#nlr').onclick=nlRun;$('#nlc').onclick=()=>{$('#nlt').value='';$('#nlo').innerHTML=''};
$('#nlt').addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();nlRun()}});
NLX.forEach(x=>{const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>{$('#nlt').value=x[1]};$('#nlx').appendChild(b)});
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);draw()}
new ResizeObserver(size).observe(cv);
try{const d=chk(JSON.parse(localStorage.getItem(KEY)||'null'));if(d)S=d;else setTimeout(help,300)}catch(e){setTimeout(help,300)}
size();if(S.shapes.length)fit();ui();
